spring.application.name=api

server.servlet.context-path=/api

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:postgresql://localhost:5432/kreitefy_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=dev

logging.level.org.springframework.security=DEBUG

# Ver qué está pasando con la validación de los datos
logging.level.org.springframework.validation=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# Muestra qué rutas está intentando procesar el DispatcherServlet
logging.level.org.springframework.web=DEBUG
# Muestra el estado de la validación de Bean Validation
logging.level.org.hibernate.validator=DEBUG

# Forzar trazas de Flyway en la consola
logging.level.org.flywaydb=DEBUG