<div class="d-flex justify-content-center m-2">
  <button type="button" class="btn btn-secondary" [routerLink]="['/', resourceName(), 'create']">
    <i class="fas fa-plus me-2"></i> {{ buttonLabel() }}
  </button>
</div>

@if (data().length > 0) {
  <div class="table-container mb-3">

    <table class="table table-bordered table-striped mb-0">
      <thead class="table-light">
      <tr>
        @for(col of columns(); track col.field){
          <th class="text-center">{{ col.header }}</th>
        }
        <th class="text-center">Acciones</th>
      </tr>
      </thead>
      <tbody>
        @for (row of data(); track row[idField()]) {
          <tr>
            @for (col of columns(); track col.field) {
              <td class="text-center">
                {{ getValue(row, col.field) | truncate: 12 }}
              </td>
            }
            <td class="text-center">

              <a [routerLink]="['/', resourceName(), 'edit', row[idField()]]" class="btn btn-sm btn-outline-primary me-2">
                <i class="fas fa-edit"></i>
              </a>

              <button type="button" (click)="onDelete(row[idField()])" class="btn btn-sm btn-outline-danger">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>

  </div>

  <div class="d-flex justify-content-center  mb-3">
    <ngb-pagination
      [page]="currentPage()"
      [collectionSize]="totalElements()"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)">
    </ngb-pagination>
  </div>
} @else {
  <div class="alert alert-secondary text-center shadow-sm">
    <i class="fa fa-info-circle me-2"></i> No hay datos añadidos.
  </div>
}

  <app-modal
    [isOpen]="mostrarModal()"
    title="Confirmar eliminación"
    [message]="'¿Estás seguro de que deseas eliminar este registro? Esta acción no se puede deshacer.'"
    (onConfirm)="confirmarBorrado()"
    (onClose)="mostrarModal.set(false)"
  />
